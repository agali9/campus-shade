name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Ruff lint
        run: ruff check src tests
      - name: Mypy strict
        run: mypy src
      - name: Run backend tests
        run: python -m pytest -q --cov=src --cov-fail-under=80
      - name: Run property tests
        run: python -m pytest -q tests/test_properties.py
      - name: Start backend for benchmark check
        run: nohup python -m uvicorn src.api:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
      - name: Wait for backend
        run: python -c "import time,requests; [time.sleep(1) for _ in range(15) if requests.get('http://localhost:8000/health/db').status_code != 200]"
      - name: Benchmark regression gate
        run: python scripts/benchmark_check.py

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm run test
      - name: Build frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t campusshade-backend ./backend
